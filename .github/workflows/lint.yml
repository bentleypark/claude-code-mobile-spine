name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Static consistency lint
        run: python3 scripts/lint.py
